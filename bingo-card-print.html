<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>どうぶつビンゴカード印刷</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #eef1f4;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 14px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 10;
  }
  .toolbar button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #fff8ea;
    border: 2px solid #ffb84d;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease;
  }
  .toolbar button:active { transform: scale(0.9); }
  .sheet-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 10px 40px;
  }
  .sheet {
    width: 190mm;
    height: 277mm;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8mm;
    padding: 6mm;
  }
  .card {
    border: 2.5px solid #444;
    border-radius: 6mm;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto repeat(3, auto) auto;
    align-content: center;
    justify-items: center;
    gap: 2mm;
    padding: 4mm;
  }
  .card-title {
    grid-column: 1 / -1;
    width: 100%;
    height: 16mm;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 6mm;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #333;
    padding-bottom: 1.5mm;
    border-bottom: 1.5px dashed #999;
  }
  .cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13mm;
    border: 1px solid #ccc;
    border-radius: 3mm;
    background: #fff;
  }
  .card-name {
    grid-column: 1 / -1;
    width: 100%;
    height: 14mm;
    display: flex;
    align-items: flex-end;
    gap: 2mm;
    font-size: 4mm;
    color: #666;
  }
  .card-name .blank {
    flex: 1;
    border-bottom: 1px solid #999;
    height: 5mm;
  }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet-wrap { padding: 0; }
    .sheet { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="regen-btn" aria-label="カードを作り直す">🔄</button>
  <button id="print-btn" aria-label="印刷する">🖨️</button>
</div>
<div class="sheet-wrap">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  "use strict";

  // bingo-caller-game.html と同じ動物プール(呼び上げと一致させる)。
  // 顔だけの絵文字は認識しにくいため、全身が描かれた絵柄で統一している。
  var ANIMALS = ["🐀", "🐄", "🐅", "🐌", "🐍", "🐘", "🐞", "🐢", "🐳", "🦈", "🦒", "🦓"];
  var CARD_COUNT = 4;

  var sheet = document.getElementById("sheet");
  var regenBtn = document.getElementById("regen-btn");
  var printBtn = document.getElementById("print-btn");

  function shuffle(array) {
    var a = array.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildCard() {
    var picks = shuffle(ANIMALS).slice(0, 9);
    var card = document.createElement("div");
    card.className = "card";

    var title = document.createElement("div");
    title.className = "card-title";
    title.textContent = "🐾 どうぶつビンゴ 🐾";
    card.appendChild(title);

    for (var i = 0; i < 9; i++) {
      var cell = document.createElement("div");
      var glyph = document.createElement("span");
      glyph.className = "cell-glyph";
      cell.className = "cell";
      glyph.textContent = picks[i];
      cell.appendChild(glyph);
      card.appendChild(cell);
    }

    var nameRow = document.createElement("div");
    nameRow.className = "card-name";
    nameRow.innerHTML = "<span>なまえ</span><span class=\"blank\"></span>";
    card.appendChild(nameRow);

    return card;
  }

  function render() {
    sheet.innerHTML = "";
    for (var i = 0; i < CARD_COUNT; i++) {
      sheet.appendChild(buildCard());
    }
  }

  regenBtn.addEventListener("click", render);
  printBtn.addEventListener("click", function () { window.print(); });

  render();
})();
</script>
</body>
</html>
