<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ちょうちょのはたけ</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  #sky {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .cloud {
    position: absolute;
    line-height: 1;
    opacity: 0.85;
    animation-name: driftCloud;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes driftCloud {
    0%   { transform: translateX(-20vw); }
    100% { transform: translateX(120vw); }
  }
  #ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 40vh;
    background: linear-gradient(180deg, #9cd97a, #77bd58);
    z-index: 1;
  }
  .flower {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    line-height: 1;
    animation: bloomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .flower.wilt {
    animation: wilt 0.6s ease-in forwards;
  }
  @keyframes bloomIn {
    0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
    70%  { transform: scale(1.25) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes wilt {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.3); opacity: 0; }
  }
  .butterfly {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    filter: drop-shadow(0 5px 7px rgba(0,0,0,0.18));
    will-change: transform;
    animation: appear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes appear {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .butterfly .glyph {
    display: inline-block;
    transform-origin: center;
    animation: flap 0.28s ease-in-out infinite alternate;
  }
  .butterfly.landing .glyph {
    animation: flap 0.16s ease-in-out infinite alternate;
  }
  .butterfly.landed .glyph {
    animation: idleSway 2.2s ease-in-out infinite;
  }
  @keyframes flap {
    0%   { transform: scaleX(1); }
    100% { transform: scaleX(0.55); }
  }
  @keyframes idleSway {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg); }
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22vw;
    pointer-events: none;
    opacity: 0;
    z-index: 999;
  }
  #celebrate.show {
    animation: celebrate 1.1s ease-out forwards;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    30%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
    60%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 0; }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage">
  <div id="sky"></div>
  <div id="ground"></div>
</div>
<div id="celebrate">🎉</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var sky = document.getElementById("sky");
  var celebrate = document.getElementById("celebrate");

  var FLOWER_EMOJI = ["🌸", "🌼", "🌻", "🌷", "🌺"];
  var CELEBRATE_EMOJI = ["🎉", "🌟", "👏", "💐"];

  var BUTTERFLY_COUNT = 4;
  var BUTTERFLY_SIZE = [58, 78];
  var GROUND_RATIO = 0.4;
  var TOP_MARGIN = 90;
  var SIDE_MARGIN = 40;
  var LAND_DWELL_MS = [2600, 5000];
  var BLOOM_MILESTONE = 8;

  var bloomCount = 0;
  var audioCtx = null;
  var bounds = { flyTop: 0, flyBottom: 0, landTop: 0, landBottom: 0, left: 0, right: 0 };

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function computeBounds() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var groundTop = h * (1 - GROUND_RATIO);
    bounds.left = SIDE_MARGIN;
    bounds.right = w - SIDE_MARGIN;
    bounds.flyTop = TOP_MARGIN;
    bounds.flyBottom = groundTop + h * GROUND_RATIO * 0.3;
    bounds.landTop = groundTop + 20;
    bounds.landBottom = h - 60;
  }

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* オーディオが使えない環境は無視 */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // --- 花が咲いたときの効果音バリエーション。毎回ランダムに選ぶ ---
  var BLOOM_SOUND_VARIANTS = [
    function gentleChime(t0) {
      [660, 990].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.08;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.24, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.3);
      });
    },
    function softPetal(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520, t0);
      osc.frequency.exponentialRampToValueAtTime(780, t0 + 0.18);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    },
    function twinkleTriad(t0) {
      [523, 784, 1047].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.06;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      });
    }
  ];

  function playBloomSound() {
    if (!audioCtx) return;
    var variant = BLOOM_SOUND_VARIANTS[Math.floor(Math.random() * BLOOM_SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playMilestoneChime() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  // --- 花が咲いたときのパーティクル演出バリエーション ---
  var PARTICLE_VARIANTS = [
    { glyphs: ["✨", "⭐️", "💫"], count: 7, angle: [0, Math.PI * 2], dist: [30, 90], rot: [0, 0], duration: 600, size: [14, 26] },
    { glyphs: ["🌸", "🍃"], count: 6, angle: [-Math.PI * 0.9, -Math.PI * 0.1], dist: [40, 100], rot: [-40, 40], duration: 750, size: [16, 26] },
    { glyphs: ["💮", "🔸"], count: 6, angle: [0, Math.PI * 2], dist: [30, 80], rot: [0, 0], duration: 550, size: [12, 22] }
  ];

  function burstParticles(x, y) {
    var v = PARTICLE_VARIANTS[Math.floor(Math.random() * PARTICLE_VARIANTS.length)];
    for (var i = 0; i < v.count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = v.glyphs[Math.floor(Math.random() * v.glyphs.length)];
      var size = rand(v.size[0], v.size[1]);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(v.angle[0], v.angle[1]);
      var dist = rand(v.dist[0], v.dist[1]);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(v.rot[0], v.rot[1]) + "deg");
      p.style.animationDuration = v.duration + "ms";
      stage.appendChild(p);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life + 50);
      })(p, v.duration);
    }
  }

  function showCelebration() {
    celebrate.textContent = CELEBRATE_EMOJI[Math.floor(Math.random() * CELEBRATE_EMOJI.length)];
    celebrate.classList.remove("show");
    void celebrate.offsetWidth;
    celebrate.classList.add("show");
  }

  // --- 空を漂う雲。ゲームの状態に関係なく常に流れ続ける背景演出 ---
  function spawnClouds() {
    var CLOUDS = [
      { top: "5%", size: 42, duration: 42, delay: -4 },
      { top: "11%", size: 30, duration: 55, delay: -22 }
    ];
    CLOUDS.forEach(function (c) {
      var el = document.createElement("div");
      el.className = "cloud";
      el.textContent = "☁️";
      el.style.top = c.top;
      el.style.fontSize = c.size + "px";
      el.style.animationDuration = c.duration + "s";
      el.style.animationDelay = c.delay + "s";
      sky.appendChild(el);
    });
  }

  // --- ちょうちょ1匹分のふるまい。花のない場所をゆらゆら飛び回り、
  //     タップされると近くの草地に降りて花を咲かせ、しばらくしてまた飛び立つ ---
  function createButterfly() {
    var size = rand(BUTTERFLY_SIZE[0], BUTTERFLY_SIZE[1]);
    var hue = Math.floor(rand(0, 360));
    var el = document.createElement("div");
    el.className = "butterfly";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.fontSize = size + "px";
    el.innerHTML = '<span class="glyph" style="filter: hue-rotate(' + hue + 'deg)">🦋</span>';
    stage.appendChild(el);

    var b = {
      el: el,
      size: size,
      x: rand(bounds.left, bounds.right),
      y: rand(bounds.flyTop, bounds.flyBottom),
      targetX: 0,
      targetY: 0,
      speed: rand(45, 90),
      state: "flying", // flying | landing | landed
      pauseUntil: 0,
      flower: null,
      dwellTimer: null
    };
    pickNewTarget(b, 0);
    applyPosition(b);

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      onTap(b);
    }, { passive: false });

    return b;
  }

  function applyPosition(b) {
    b.el.style.left = (b.x - b.size / 2) + "px";
    b.el.style.top = (b.y - b.size / 2) + "px";
  }

  function pickNewTarget(b, now) {
    b.targetX = rand(bounds.left, bounds.right);
    b.targetY = rand(bounds.flyTop, bounds.flyBottom);
    b.pauseUntil = now + rand(200, 900);
  }

  function moveToward(b, dt) {
    var dx = b.targetX - b.x;
    var dy = b.targetY - b.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 4) return true;
    var step = b.speed * dt;
    if (step >= dist) {
      b.x = b.targetX;
      b.y = b.targetY;
    } else {
      b.x += (dx / dist) * step;
      b.y += (dy / dist) * step;
    }
    applyPosition(b);
    return false;
  }

  function onTap(b) {
    if (b.state !== "flying") return;
    ensureAudio();
    b.state = "landing";
    b.el.classList.add("landing");
    b.targetX = Math.max(bounds.left, Math.min(bounds.right, b.x + rand(-30, 30)));
    b.targetY = rand(bounds.landTop, bounds.landBottom);
  }

  function onLanded(b) {
    b.state = "landed";
    b.el.classList.remove("landing");
    b.el.classList.add("landed");

    var flower = document.createElement("div");
    flower.className = "flower";
    flower.textContent = FLOWER_EMOJI[Math.floor(Math.random() * FLOWER_EMOJI.length)];
    var flowerSize = b.size * 0.6;
    flower.style.fontSize = flowerSize + "px";
    flower.style.left = (b.x - flowerSize / 2) + "px";
    flower.style.top = (b.y + b.size * 0.28) + "px";
    stage.appendChild(flower);
    b.flower = flower;

    burstParticles(b.x, b.y);
    playBloomSound();

    bloomCount++;
    if (bloomCount % BLOOM_MILESTONE === 0) {
      showCelebration();
      playMilestoneChime();
    }

    b.dwellTimer = setTimeout(function () { leave(b); }, rand(LAND_DWELL_MS[0], LAND_DWELL_MS[1]));
  }

  function leave(b) {
    if (b.flower) {
      var f = b.flower;
      f.classList.add("wilt");
      setTimeout(function () { f.remove(); }, 650);
      b.flower = null;
    }
    b.el.classList.remove("landed");
    b.state = "flying";
    pickNewTarget(b, performance.now());
  }

  var butterflies = [];

  function step(dt, now) {
    butterflies.forEach(function (b) {
      if (b.state === "flying") {
        if (now < b.pauseUntil) return;
        var arrived = moveToward(b, dt);
        if (arrived) pickNewTarget(b, now);
      } else if (b.state === "landing") {
        var reached = moveToward(b, dt);
        if (reached) onLanded(b);
      }
    });
  }

  var lastTs = null;
  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
    lastTs = ts;
    step(dt, ts);
    requestAnimationFrame(frame);
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("pointerdown", ensureAudio, { once: true });

  window.addEventListener("resize", function () {
    computeBounds();
    butterflies.forEach(function (b) {
      b.x = Math.max(bounds.left, Math.min(bounds.right, b.x));
      b.y = Math.max(bounds.flyTop, Math.min(bounds.landBottom, b.y));
      applyPosition(b);
    });
  });

  computeBounds();
  spawnClouds();
  for (var j = 0; j < BUTTERFLY_COUNT; j++) {
    butterflies.push(createButterfly());
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
