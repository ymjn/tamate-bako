<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>とけいのじかん</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* このゲームは時刻ごとの空の色そのものが主役なので、他ゲームの bgshift アニメーションは使わず
     JS で currentHour に応じたグラデーションを直接 body.style.background に設定する */
  body {
    background: linear-gradient(180deg, #6ec3f4, #fdfcdc);
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .star, .cloud, .ghost {
    position: absolute;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .star {
    animation: twinkle 2.6s ease-in-out infinite;
  }
  body.is-night .star {
    opacity: var(--maxop, 0.85);
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.3); }
  }
  .cloud {
    animation: driftX linear infinite;
  }
  body.is-day .cloud {
    opacity: 0.8;
  }
  @keyframes driftX {
    0%   { transform: translateX(-20vw); }
    100% { transform: translateX(120vw); }
  }
  .ghost {
    animation: driftGhost ease-in-out infinite;
    pointer-events: none;
    touch-action: manipulation;
  }
  body.is-late-night .ghost {
    opacity: 0.5;
    pointer-events: auto;
  }
  @keyframes driftGhost {
    0%, 100% { transform: translate(-14vw, 0) rotate(-4deg); }
    50%      { transform: translate(14vw, -6vh) rotate(4deg); }
  }
  @keyframes ghostFlee {
    0%   { transform: translate(0, 0) scale(1); opacity: 0.5; }
    80%  { opacity: 0.5; }
    100% { transform: translate(var(--flee-dx), var(--flee-dy)) scale(0.7); opacity: 0; }
  }
  #scene {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    padding-bottom: 110px;
    z-index: 2;
    pointer-events: none;
  }
  #sky-emoji {
    font-size: clamp(56px, 15vw, 120px);
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
    line-height: 1;
  }
  #clock-face {
    font-size: clamp(140px, 38vw, 260px);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
    line-height: 1;
  }
  #hour-label {
    font-size: clamp(28px, 8vw, 52px);
    font-weight: 700;
    color: #4a3b6b;
    background: rgba(255, 255, 255, 0.85);
    padding: 2px 26px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    line-height: 1.4;
  }
  .pulse {
    animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  #now-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #now-btn:active {
    transform: scale(0.88);
  }
  #hour-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 0 10px;
    z-index: 10;
  }
  .hour-btn {
    width: clamp(40px, 10vw, 56px);
    height: clamp(40px, 10vw, 56px);
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 5vw, 30px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  .hour-btn:active {
    transform: scale(0.88);
  }
  .hour-btn.selected {
    transform: scale(1.45);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.9);
    z-index: 1;
  }
  .hour-btn.selected:active {
    transform: scale(1.3);
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<button id="now-btn" type="button" aria-label="いまのじかんにもどる">🕛</button>
<div id="stage"></div>
<div id="scene">
  <div id="sky-emoji">☀️</div>
  <div id="clock-face">🕛</div>
  <div id="hour-label">１２じ</div>
</div>
<div id="hour-bar"></div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var skyEmoji = document.getElementById("sky-emoji");
  var clockFace = document.getElementById("clock-face");
  var hourLabel = document.getElementById("hour-label");
  var nowBtn = document.getElementById("now-btn");
  var hourBar = document.getElementById("hour-bar");
  var hourButtons = [];

  var HOUR_EMOJI = ["🕛", "🕐", "🕑", "🕒", "🕓", "🕔", "🕕", "🕖", "🕗", "🕘", "🕙", "🕚"];
  var HOUR_LABELS = ["１２じ", "１じ", "２じ", "３じ", "４じ", "５じ", "６じ", "７じ", "８じ", "９じ", "１０じ", "１１じ"];

  // 空の色をつなぐキーフレーム: hour(0-24)と上下2色。あいだは線形補間する
  var SKY_STOPS = [
    { h: 0,    top: "#0b1026", bottom: "#1b1a4a" },
    { h: 4,    top: "#0b1026", bottom: "#1b1a4a" },
    { h: 5.5,  top: "#2b2860", bottom: "#5b3d7a" },
    { h: 6.5,  top: "#5b3d7a", bottom: "#ff8b6b" },
    { h: 8,    top: "#7ec8f2", bottom: "#ffe29a" },
    { h: 12,   top: "#6ec3f4", bottom: "#fdfcdc" },
    { h: 15,   top: "#7ec8f2", bottom: "#ffe29a" },
    { h: 17,   top: "#ff9a76", bottom: "#ffd97a" },
    { h: 18.5, top: "#8a4a8f", bottom: "#ff6f61" },
    { h: 20,   top: "#2b2860", bottom: "#5b3d7a" },
    { h: 21.5, top: "#0b1026", bottom: "#1b1a4a" },
    { h: 24,   top: "#0b1026", bottom: "#1b1a4a" }
  ];

  var audioCtx = null;
  var timelineHours = 0;
  var animating = false;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* audio unavailable, ignore */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
  }

  function lerpColor(a, b, t) {
    var ca = hexToRgb(a), cb = hexToRgb(b);
    var r = Math.round(ca.r + (cb.r - ca.r) * t);
    var g = Math.round(ca.g + (cb.g - ca.g) * t);
    var bch = Math.round(ca.b + (cb.b - ca.b) * t);
    return "rgb(" + r + "," + g + "," + bch + ")";
  }

  function colorForHour(hour) {
    for (var i = 0; i < SKY_STOPS.length - 1; i++) {
      var a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
      if (hour >= a.h && hour <= b.h) {
        var t = (hour - a.h) / (b.h - a.h);
        return { top: lerpColor(a.top, b.top, t), bottom: lerpColor(a.bottom, b.bottom, t) };
      }
    }
    var last = SKY_STOPS[SKY_STOPS.length - 1];
    return { top: last.top, bottom: last.bottom };
  }

  function glyphForHour(hour) {
    var h12 = Math.floor(hour) % 12;
    if (h12 < 0) h12 += 12;
    return HOUR_EMOJI[h12];
  }

  function companionForHour(hour) {
    if (hour >= 19 || hour < 5) return "🌙";
    if (hour < 7) return "🌅";
    if (hour < 16) return "☀️";
    if (hour < 18) return "🌇";
    return "🌆";
  }

  function pulse(el) {
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  function render(hourRaw) {
    var hour = ((hourRaw % 24) + 24) % 24;
    var colors = colorForHour(hour);
    document.body.style.background =
      "linear-gradient(180deg, " + colors.top + " 0%, " + colors.bottom + " 100%)";

    var glyph = glyphForHour(hour);
    if (clockFace.textContent !== glyph) {
      clockFace.textContent = glyph;
      pulse(clockFace);
    }
    var label = HOUR_LABELS[Math.floor(hour) % 12];
    if (hourLabel.textContent !== label) {
      hourLabel.textContent = label;
      pulse(hourLabel);
    }
    var comp = companionForHour(hour);
    if (skyEmoji.textContent !== comp) {
      skyEmoji.textContent = comp;
      pulse(skyEmoji);
    }
    document.body.classList.toggle("is-night", hour >= 19 || hour < 5);
    document.body.classList.toggle("is-late-night", hour >= 21 || hour < 5);
    document.body.classList.toggle("is-day", hour >= 7 && hour < 17);

    var flooredHour = Math.floor(hour);
    hourButtons.forEach(function (btn) {
      btn.classList.toggle("selected", btn.hourValue === flooredHour);
    });
  }

  // --- 効果音: タップするたびランダムに選ぶ、時計をイメージした音色いろいろ ---
  var SOUND_VARIANTS = [
    function tickTock(t0) {
      [0, 0.14].forEach(function (offset) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(offset === 0 ? 700 : 500, t0 + offset);
        gain.gain.setValueAtTime(0.0001, t0 + offset);
        gain.gain.exponentialRampToValueAtTime(0.18, t0 + offset + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.08);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + offset);
        osc.stop(t0 + offset + 0.1);
      });
    },
    function risingChime(t0) {
      [523, 659, 784].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.09;
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.28, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.26);
      });
    },
    function softBell(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(rand(700, 900), t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.6);
    },
    function xyloSweep(t0) {
      [440, 554, 659, 784, 988].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.045;
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.25, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.16);
      });
    }
  ];

  function playTapSound() {
    if (!audioCtx) return;
    var variant = SOUND_VARIANTS[Math.floor(Math.random() * SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  // --- パーティクル: 時計まわりの演出用にキラキラ系の絵文字を散らす ---
  var PARTICLE_GLYPHS = ["✨", "⭐️", "💫", "🕰️"];

  function burstParticles(x, y) {
    var count = Math.floor(rand(6, 9));
    for (var i = 0; i < count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = PARTICLE_GLYPHS[Math.floor(Math.random() * PARTICLE_GLYPHS.length)];
      var size = rand(16, 30);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(0, Math.PI * 2);
      var dist = rand(40, 110);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(-60, 60) + "deg");
      p.style.animationDuration = "650ms";
      stage.appendChild(p);
      (function (node) {
        setTimeout(function () { node.remove(); }, 700);
      })(p);
    }
  }

  // --- 装飾: 夜は星がまたたき、昼は雲がゆっくり流れる(見た目のにぎやかさ用、操作対象ではない) ---
  function spawnDecor() {
    for (var i = 0; i < 6; i++) {
      var star = document.createElement("div");
      star.className = "star";
      star.textContent = "⭐️";
      star.style.left = rand(4, 92) + "vw";
      star.style.top = rand(4, 40) + "vh";
      star.style.fontSize = rand(14, 26) + "px";
      star.style.setProperty("--maxop", rand(0.5, 0.95).toFixed(2));
      star.style.animationDelay = rand(0, 2.6) + "s";
      stage.appendChild(star);
    }
    for (var j = 0; j < 3; j++) {
      var cloud = document.createElement("div");
      cloud.className = "cloud";
      cloud.textContent = "☁️";
      cloud.style.top = rand(6, 30) + "vh";
      cloud.style.fontSize = rand(28, 46) + "px";
      cloud.style.animationDuration = rand(28, 46) + "s";
      cloud.style.animationDelay = "-" + rand(0, 30) + "s";
      stage.appendChild(cloud);
    }
    for (var k = 0; k < 2; k++) {
      spawnGhost();
    }
  }

  function spawnGhost() {
    var ghost = document.createElement("div");
    ghost.className = "ghost";
    ghost.textContent = "👻";
    ghost.style.left = rand(10, 80) + "vw";
    ghost.style.top = rand(10, 45) + "vh";
    ghost.style.fontSize = rand(30, 46) + "px";
    ghost.style.animationDuration = rand(14, 20) + "s";
    ghost.style.animationDelay = "-" + rand(0, 16) + "s";
    ghost.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      if (ghost.classList.contains("fleeing")) return;
      var rect = ghost.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = cx - ev.clientX;
      var dy = cy - ev.clientY;
      var len = Math.hypot(dx, dy) || 1;
      var travel = Math.max(window.innerWidth, window.innerHeight) * 1.3;

      // ふわふわ漂うアニメーションを止めてから今の見た目位置に固定する。
      // 動いたまま(driftGhostが生きたまま)transformを書き換えても、
      // 実行中のCSSアニメーションの値が常にインライン指定より優先されるため無視されてしまい、
      // 直後にアニメーションを切り替えると値が飛んでジャンプして見えていた。
      ghost.classList.add("fleeing");
      ghost.style.animation = "none";
      ghost.style.left = rect.left + "px";
      ghost.style.top = rect.top + "px";
      void ghost.offsetWidth;
      ghost.style.setProperty("--flee-dx", (dx / len * travel) + "px");
      ghost.style.setProperty("--flee-dy", (dy / len * travel) + "px");
      ghost.style.animation = "ghostFlee 5s linear forwards";
      setTimeout(function () {
        ghost.style.animation = "";
        ghost.style.left = rand(10, 80) + "vw";
        ghost.style.top = rand(10, 45) + "vh";
        ghost.style.animationDuration = rand(14, 20) + "s";
        ghost.style.animationDelay = "-" + rand(0, 16) + "s";
        ghost.classList.remove("fleeing");
      }, rand(6500, 8500));
    }, { passive: false });
    stage.appendChild(ghost);
  }

  // ボタンをタップしたとき、いちばん近い向き(進む/戻る)へ短く動かす
  function deltaToHour(targetHour, current) {
    var diff = (targetHour - current) % 24;
    if (diff > 12) diff -= 24;
    if (diff <= -12) diff += 24;
    return diff;
  }

  function animateTo(delta) {
    var start = timelineHours;
    var target = start + delta;
    var duration = Math.min(2200, 500 + Math.abs(delta) * 90);
    var startTime = null;
    animating = true;

    function step(ts) {
      if (!startTime) startTime = ts;
      var p = Math.min(1, (ts - startTime) / duration);
      var eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      timelineHours = start + (target - start) * eased;
      render(timelineHours);
      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        timelineHours = target;
        render(timelineHours);
        animating = false;
      }
    }
    requestAnimationFrame(step);
  }

  // 朝7時〜夜21時までの、子どもの一日に関係のある時間だけをボタンにする
  var DAY_START_HOUR = 7;
  var NIGHT_HOUR = 21;

  function buildHourButtons() {
    for (var hour = DAY_START_HOUR; hour <= NIGHT_HOUR; hour++) {
      (function (targetHour) {
        var btn = document.createElement("button");
        btn.className = "hour-btn";
        btn.type = "button";
        btn.textContent = HOUR_EMOJI[targetHour % 12];
        btn.setAttribute("aria-label", "じかんをすすめる");
        btn.hourValue = targetHour;
        hourButtons.push(btn);
        btn.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          if (animating) return;
          ensureAudio();
          var current = ((timelineHours % 24) + 24) % 24;
          var delta = deltaToHour(targetHour, current);
          var rect = btn.getBoundingClientRect();
          burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
          playTapSound();
          animateTo(delta);
        }, { passive: false });
        hourBar.appendChild(btn);
      })(hour);
    }
  }

  // 右上のボタンは「いまの本当の時刻」を表示し、押すとその時刻へジャンプする
  function realHours() {
    var now = new Date();
    return now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  }

  function updateNowBtn() {
    var glyph = glyphForHour(realHours());
    if (nowBtn.textContent !== glyph) {
      nowBtn.textContent = glyph;
      pulse(nowBtn);
    }
  }

  nowBtn.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (animating) return;
    ensureAudio();
    var current = ((timelineHours % 24) + 24) % 24;
    var delta = deltaToHour(realHours(), current);
    var rect = nowBtn.getBoundingClientRect();
    burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    playTapSound();
    animateTo(delta);
  }, { passive: false });

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("pointerdown", ensureAudio, { once: true });

  timelineHours = realHours();
  buildHourButtons();
  render(timelineHours);
  spawnDecor();
  updateNowBtn();
  setInterval(updateNowBtn, 30000);
})();
</script>
</body>
</html>
