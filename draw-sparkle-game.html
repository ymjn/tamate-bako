<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>おえかきキラキラ</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #canvas {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }
  .particle {
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 0; }
    30%  { transform: translate(calc(var(--dx) * 0.3), calc(var(--dy) * 0.3)) scale(1.1) rotate(calc(var(--rot, 0deg) * 0.3)); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #back-btn, #clear-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn { left: max(12px, env(safe-area-inset-left)); }
  #clear-btn { right: max(12px, env(safe-area-inset-right)); }
  #back-btn:active, #clear-btn:active { transform: scale(0.9); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<button id="clear-btn" aria-label="ぜんぶけす">🗑️</button>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var clearBtn = document.getElementById("clear-btn");

  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* オーディオが使えない環境は無視 */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  // --- キャンバスの初期化・リサイズ ---
  // devicePixelRatio に合わせてバッキングストアを拡大し、以降の描画座標はCSSピクセルで扱う。
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // --- 虹色の線を描く ---
  var hue = rand(0, 360);

  function drawDot(x, y) {
    var color = "hsl(" + hue.toFixed(1) + ", 90%, 62%)";
    ctx.save();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSegment(x0, y0, x1, y1) {
    var dist = Math.hypot(x1 - x0, y1 - y0);
    var color = "hsl(" + hue.toFixed(1) + ", 90%, 62%)";
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 10;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.restore();
    // 線をなぞった距離に応じて色相を進め、1本のストロークの中でも虹色が流れるようにする
    hue = (hue + dist * 0.35) % 360;
  }

  function clearCanvas() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  }

  // --- 描いた線を少しずつ薄くして消していくループ ---
  // destination-out で透明色を重ねることで、背景のグラデーションが常に透けて見える。
  // dt(経過ミリ秒)ベースで減衰率を計算するので、端末の性能差でフェード速度が変わらない。
  var FADE_MS = 4200;      // このくらいの時間でほぼ消える
  var FADE_REMAIN = 0.04;  // FADE_MS経過後に残っている割合
  var lastFrameTime = performance.now();

  function frameLoop(now) {
    var dt = now - lastFrameTime;
    lastFrameTime = now;
    if (dt > 0) {
      var fadeAlpha = 1 - Math.pow(FADE_REMAIN, dt / FADE_MS);
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0, 0, 0, " + fadeAlpha + ")";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.restore();
    }
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);

  // --- キラキラ粒子(DOM) ---
  function spawnSparkle(x, y) {
    var size = rand(16, 28);
    var p = document.createElement("div");
    p.className = "particle";
    p.textContent = "✨";
    p.style.fontSize = size + "px";
    p.style.left = (x - size / 2) + "px";
    p.style.top = (y - size / 2) + "px";
    var angle = rand(-Math.PI, 0); // ふわっと上向きに散る
    var dist = rand(16, 40);
    p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    p.style.setProperty("--rot", rand(-30, 30) + "deg");
    var duration = rand(600, 900);
    p.style.animationDuration = duration + "ms";
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, duration + 60);
  }

  // --- 音: ドラッグ中に鳴らすキラキラ音のバリエーション ---
  // 縦位置(y)を周波数にマッピングし、画面の上のほうをなぞると高い音、下のほうは低い音になる。
  function freqFromY(y) {
    var h = window.innerHeight || 1;
    var ratio = 1 - Math.min(1, Math.max(0, y / h));
    return 320 + ratio * 620;
  }

  var TWINKLE_VARIANTS = [
    function twinkleA(t0, freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.18);
    },
    function twinkleB(t0, freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq * 0.9, t0);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.15, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.17);
    },
    function twinkleC(t0, freq) {
      [1, 1.5].forEach(function (mult, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.045;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * mult, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.14, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.11);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.13);
      });
    },
    function twinkleD(t0, freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq * 1.5, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.12);
    }
  ];

  function playTwinkle(y) {
    if (!audioCtx) return;
    var variant = TWINKLE_VARIANTS[Math.floor(Math.random() * TWINKLE_VARIANTS.length)];
    variant(audioCtx.currentTime, freqFromY(y));
  }

  // --- イースターエッグ: 同じ場所を長押しすると花火が上がる ---
  var FIREWORK_GLYPHS = ["✨", "🎆", "💫"];

  function spawnFireworkParticle(x, y) {
    var size = rand(20, 34);
    var p = document.createElement("div");
    p.className = "particle";
    p.textContent = FIREWORK_GLYPHS[Math.floor(Math.random() * FIREWORK_GLYPHS.length)];
    p.style.fontSize = size + "px";
    p.style.left = (x - size / 2) + "px";
    p.style.top = (y - size / 2) + "px";
    var angle = rand(0, Math.PI * 2);
    var dist = rand(60, 140);
    p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    p.style.setProperty("--rot", rand(-180, 180) + "deg");
    var duration = rand(700, 1100);
    p.style.animationDuration = duration + "ms";
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, duration + 60);
  }

  var FIREWORK_VARIANTS = [
    function fireworkA(t0) {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (freq, i) {
        var start = t0 + i * 0.07;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.24);
      });
    },
    function fireworkB(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(300, t0);
      osc.frequency.exponentialRampToValueAtTime(1400, t0 + 0.35);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.42);
    },
    function fireworkC(t0) {
      [0, 1, 2].forEach(function (i) {
        var start = t0 + i * 0.09;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(700 + i * 260, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.16, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.17);
      });
    }
  ];

  function playFireworkSound() {
    if (!audioCtx) return;
    var variant = FIREWORK_VARIANTS[Math.floor(Math.random() * FIREWORK_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function triggerFirework(x, y) {
    var count = Math.floor(rand(14, 20));
    for (var i = 0; i < count; i++) {
      spawnFireworkParticle(x, y);
    }
    playFireworkSound();
  }

  var FIREWORK_HOLD_MS = 850;
  var FIREWORK_REPEAT_MS = 700;
  var FIREWORK_TOLERANCE = 14;

  // 指を置いたまま動かさずにいると花火が上がる。少しでも動いたら判定を打ち切る。
  function scheduleFirework(state) {
    state.holdTimer = setTimeout(function () {
      triggerFirework(state.holdOrigin.x, state.holdOrigin.y);
      state.holdInterval = setInterval(function () {
        triggerFirework(state.holdOrigin.x, state.holdOrigin.y);
      }, FIREWORK_REPEAT_MS);
    }, FIREWORK_HOLD_MS);
  }

  function cancelFirework(state) {
    if (state.holdTimer) { clearTimeout(state.holdTimer); state.holdTimer = null; }
    if (state.holdInterval) { clearInterval(state.holdInterval); state.holdInterval = null; }
  }

  function playClearSound() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(700, t0);
    osc.frequency.exponentialRampToValueAtTime(180, t0 + 0.3);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.36);
  }

  // --- ポインター(指)の追跡 ---
  // 複数本指で同時に描いても良いよう、pointerIdごとに状態を持つ。
  var pointers = new Map();

  function handleDown(e) {
    e.preventDefault();
    ensureAudio();
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
    var state = {
      x: e.clientX,
      y: e.clientY,
      distSinceSparkle: 0,
      sparkleThreshold: rand(45, 80),
      lastSoundTime: performance.now(),
      soundThreshold: rand(60, 100),
      holdOrigin: { x: e.clientX, y: e.clientY },
      holdTimer: null,
      holdInterval: null
    };
    pointers.set(e.pointerId, state);
    scheduleFirework(state);
    drawDot(e.clientX, e.clientY);
    spawnSparkle(e.clientX, e.clientY);
    playTwinkle(e.clientY);
  }

  function handleMove(e) {
    var state = pointers.get(e.pointerId);
    if (!state) return;
    e.preventDefault();
    var x = e.clientX, y = e.clientY;
    var dist = Math.hypot(x - state.x, y - state.y);
    if (dist > 0.5) {
      drawSegment(state.x, state.y, x, y);
    }

    if (state.holdTimer || state.holdInterval) {
      if (Math.hypot(x - state.holdOrigin.x, y - state.holdOrigin.y) > FIREWORK_TOLERANCE) {
        cancelFirework(state);
      }
    }

    state.distSinceSparkle += dist;
    if (state.distSinceSparkle >= state.sparkleThreshold) {
      spawnSparkle(x, y);
      state.distSinceSparkle = 0;
      state.sparkleThreshold = rand(45, 80);
    }

    var now = performance.now();
    if (now - state.lastSoundTime >= state.soundThreshold) {
      playTwinkle(y);
      state.lastSoundTime = now;
      state.soundThreshold = rand(60, 100);
    }

    state.x = x;
    state.y = y;
  }

  function handleUp(e) {
    var state = pointers.get(e.pointerId);
    if (state) cancelFirework(state);
    pointers.delete(e.pointerId);
  }

  canvas.addEventListener("pointerdown", handleDown, { passive: false });
  canvas.addEventListener("pointermove", handleMove, { passive: false });
  canvas.addEventListener("pointerup", handleUp, { passive: false });
  canvas.addEventListener("pointercancel", handleUp, { passive: false });

  clearBtn.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    ensureAudio();
    pointers.forEach(cancelFirework);
    pointers.clear();
    clearCanvas();
    playClearSound();
  }, { passive: false });

  // --- キッズプルーフ: ピンチズーム・スクロール・誤操作によるページ遷移を防止 ---
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("pointerdown", ensureAudio, { once: true });
})();
</script>
</body>
</html>
