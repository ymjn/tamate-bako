<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>そだてポン</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  .bubble {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               float 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes popin {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { margin-top: 0px; }
    50%      { margin-top: -14px; }
  }
  .bubble.growing {
    animation: growpulse 0.3s ease-out;
  }
  @keyframes growpulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
  .bubble.popping {
    animation: popout 0.28s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popout {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--end-scale, 0.4)) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22vw;
    pointer-events: none;
    opacity: 0;
  }
  #celebrate.show {
    animation: celebrate 1.1s ease-out forwards;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    30%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
    60%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 0; }
  }
  #celebrate.grand {
    font-size: 8vw;
    animation: grandCelebrate 3s ease-out forwards;
  }
  @keyframes grandCelebrate {
    0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
    20%  { transform: scale(1.4) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 24px gold); }
    40%  { transform: scale(1.05) rotate(-5deg); opacity: 1; filter: drop-shadow(0 0 10px gold); }
    60%  { transform: scale(1.3) rotate(4deg); opacity: 1; filter: drop-shadow(0 0 28px gold); }
    80%  { transform: scale(1.1) rotate(-2deg); opacity: 1; filter: drop-shadow(0 0 14px gold); }
    100% { transform: scale(1.5) rotate(0deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage"></div>
<div id="celebrate">🎉</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var celebrate = document.getElementById("celebrate");

  // 🥚 → 🐣 → 🐥 → 🐓 の順に育ち、🐓 をタップすると消えて新しい🥚が生まれる
  var STAGES = ["🥚", "🐣", "🐥", "🐓"];
  var LAST_STAGE = STAGES.length - 1;

  var MAX_BUBBLES = 6;
  var popCount = 0;
  var bubbles = new Set();
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* オーディオが使えない環境は無視 */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // --- 育つときの「ピヨッ」という鳴き声風の効果音、数種類からランダム ---
  var GROW_VARIANTS = [
    function chirpHigh(t0) {
      [1200, 1500].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.05;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.09);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.1);
      });
    },
    function chirpSlide(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(900, t0);
      osc.frequency.exponentialRampToValueAtTime(1600, t0 + 0.1);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.18);
    }
  ];

  // --- 🐓が飛び立って消えるときの効果音、数種類からランダム ---
  var POP_VARIANTS = [
    function classicPop(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, t0);
      osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.12);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.25);
    },
    function whoosh(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(300, t0);
      osc.frequency.exponentialRampToValueAtTime(900, t0 + 0.18);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.26);
    }
  ];

  function playGrowSound() {
    if (!audioCtx) return;
    var variant = GROW_VARIANTS[Math.floor(Math.random() * GROW_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playPopSound() {
    if (!audioCtx) return;
    var variant = POP_VARIANTS[Math.floor(Math.random() * POP_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playCelebrationChime() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  // --- イースターエッグ: 画面上の6羽が全員🐓まで育ちきったときの豪華なファンファーレ ---
  function playGrandGrowFanfare() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var melody = [784, 988, 1175, 1319, 1568, 1976, 2349];
    melody.forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.08;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.26);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.28);
    });
    var chordStart = t0 + melody.length * 0.08 + 0.05;
    [1319, 1568, 1976, 2349].forEach(function (freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, chordStart);
      gain.gain.setValueAtTime(0.0001, chordStart);
      gain.gain.exponentialRampToValueAtTime(0.24, chordStart + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 0.85);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(chordStart);
      osc.stop(chordStart + 0.9);
    });
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  var GROW_PARTICLES = { glyphs: ["🪶", "✨"], count: 6, angle: [0, Math.PI * 2], dist: [30, 70], rot: [-30, 30], duration: 500, size: [16, 26] };
  var POP_PARTICLES = { glyphs: ["✨", "⭐️", "💫", "🌟"], count: 10, angle: [0, Math.PI * 2], dist: [50, 130], rot: [0, 0], duration: 650, size: [18, 34] };

  function burstParticles(x, y, v) {
    for (var i = 0; i < v.count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = v.glyphs[Math.floor(Math.random() * v.glyphs.length)];
      var size = rand(v.size[0], v.size[1]);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(v.angle[0], v.angle[1]);
      var dist = rand(v.dist[0], v.dist[1]);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(v.rot[0], v.rot[1]) + "deg");
      p.style.animationDuration = v.duration + "ms";
      stage.appendChild(p);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life + 50);
      })(p, v.duration);
    }
  }

  // --- イースターエッグ: 6羽全員が育ちきったときに降らせる紙吹雪 ---
  function grandConfettiShower() {
    var glyphs = ["🐓", "🪶", "✨", "⭐️"];
    for (var i = 0; i < 30; i++) {
      (function (i) {
        setTimeout(function () {
          var p = document.createElement("div");
          p.className = "particle";
          p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          var size = rand(20, 38);
          p.style.fontSize = size + "px";
          var startX = rand(0, window.innerWidth);
          p.style.left = (startX - size / 2) + "px";
          p.style.top = "-40px";
          var duration = rand(2000, 3200);
          p.style.setProperty("--dx", rand(-60, 60) + "px");
          p.style.setProperty("--dy", (window.innerHeight + 80) + "px");
          p.style.setProperty("--rot", rand(-180, 180) + "deg");
          p.style.setProperty("--end-scale", "0.9");
          p.style.animationDuration = duration + "ms";
          stage.appendChild(p);
          setTimeout(function () { p.remove(); }, duration + 50);
        }, i * 55);
      })(i);
    }
  }

  function showCelebration(text, mode) {
    celebrate.textContent = text;
    celebrate.classList.remove("show", "grand");
    void celebrate.offsetWidth;
    celebrate.classList.add("show");
    if (mode) celebrate.classList.add(mode);
  }

  // 画面上の6羽が全員🐓まで育ちきったかどうかを確認する
  function checkAllGrown() {
    if (bubbles.size < MAX_BUBBLES) return;
    var allGrown = true;
    bubbles.forEach(function (r) {
      if (r.stage !== LAST_STAGE) allGrown = false;
    });
    if (!allGrown) return;

    ensureAudio();
    showCelebration(STAGES[LAST_STAGE].repeat(MAX_BUBBLES), "grand");
    playGrandGrowFanfare();
    grandConfettiShower();
  }

  function spawnBubble() {
    if (bubbles.size >= MAX_BUBBLES) return;

    var size = rand(70, 130);
    var el = document.createElement("div");
    el.className = "bubble";
    el.textContent = STAGES[0];
    el.style.fontSize = size + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";

    var margin = size * 0.6;
    var x = rand(margin, window.innerWidth - margin - size);
    var y = rand(margin, window.innerHeight - margin - size);
    el.style.left = x + "px";
    el.style.top = y + "px";

    stage.appendChild(el);

    var record = { el: el, stage: 0 };
    bubbles.add(record);

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      onTap(record, ev.clientX, ev.clientY);
    }, { passive: false });
  }

  function onTap(record, x, y) {
    if (record.el.classList.contains("popping")) return;
    ensureAudio();

    if (record.stage < LAST_STAGE) {
      record.stage++;
      record.el.textContent = STAGES[record.stage];
      record.el.classList.remove("growing");
      void record.el.offsetWidth;
      record.el.classList.add("growing");
      burstParticles(x, y, GROW_PARTICLES);
      playGrowSound();
      if (record.stage === LAST_STAGE) checkAllGrown();
      return;
    }

    record.el.classList.add("popping");
    bubbles.delete(record);
    burstParticles(x, y, POP_PARTICLES);
    playPopSound();

    popCount++;
    if (popCount % 8 === 0) {
      showCelebration("🎉", null);
      playCelebrationChime();
    }

    setTimeout(function () {
      record.el.remove();
      spawnBubble();
    }, 280);
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  document.addEventListener("pointerdown", ensureAudio, { once: true });

  for (var i = 0; i < 4; i++) {
    setTimeout(spawnBubble, i * 300);
  }
  setInterval(function () {
    if (bubbles.size < MAX_BUBBLES) spawnBubble();
  }, 1100);

  window.addEventListener("resize", function () {
    bubbles.forEach(function (record) {
      var rect = record.el.getBoundingClientRect();
      var x = Math.min(parseFloat(record.el.style.left), window.innerWidth - rect.width - 10);
      var y = Math.min(parseFloat(record.el.style.top), window.innerHeight - rect.height - 10);
      record.el.style.left = Math.max(10, x) + "px";
      record.el.style.top = Math.max(10, y) + "px";
    });
  });
})();
</script>
</body>
</html>
