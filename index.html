<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>あそびのもくじ</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", system-ui, sans-serif;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 6vh 5vw 4vh;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    font-size: clamp(28px, 7vw, 48px);
    color: #5a4a6a;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    margin: 0 0 5vh;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 700px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 28px;
    padding: 24px 12px;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active {
    transform: scale(0.94);
  }
  .card .icon {
    font-size: clamp(48px, 12vw, 72px);
    line-height: 1;
  }
  .card .label {
    font-size: clamp(13px, 3.2vw, 20px);
    color: #5a4a6a;
    font-weight: bold;
    white-space: nowrap;
  }
  .terms {
    width: 100%;
    max-width: 700px;
    margin-top: 5vh;
    color: #7a6d88;
    font-size: 12px;
  }
  .terms summary {
    text-align: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .terms-hint {
    font-size: 10px;
    color: #a89bb8;
  }
  .terms .terms-body {
    margin-top: 12px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 16px;
    line-height: 1.7;
  }
  .terms .terms-body p {
    margin: 0 0 8px;
  }
  .terms .terms-body p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
<h1>あそびの もくじ</h1>
<div class="grid" id="grid"></div>

<details class="terms" id="terms">
  <summary>保護者の方へ <span class="terms-hint">(5回タップすると開きます)</span></summary>
  <div class="terms-body">
    <p>このサイトは、個人が趣味で公開している幼児向けの無料ゲーム集です。</p>
    <p>通信や外部送信は行っておらず、個人情報の収集も行っていません。広告もありません。</p>
    <p>予告なく内容の変更・追加・削除、公開の停止を行うことがあります。</p>
    <p>本サイトのご利用で何か不都合が生じても対応しきれないことがあります。あらかじめご了承のうえお使いください。</p>
    <hr>
    <p>気に入っていただけたら、<a href="https://ofuse.me/a1dca29f" target="_blank" rel="noopener">OFUSEで投げ銭</a>していただけると嬉しいです。</p>
    <p>お問い合わせ: X(Twitter) <a href="https://twitter.com/jun21" target="_blank" rel="noopener">@jun21</a></p>
  </div>
</details>

<script>
  var GAMES = [
    { title: "ぽんぽん", icon: "🫧", file: "pop-pop-game.html" },
    { title: "よるのぽんぽん", icon: "👻", file: "night-pop-game.html" },
    { title: "たからさがし", icon: "💎", file: "treasure-hunt-game.html" },
    { title: "スタンプ", icon: "🖼️", file: "stamp-game.html" },
    { title: "そだてポン", icon: "🥚", file: "grow-pop-game.html" },
    { title: "どうぶつビンゴ", icon: "🎪", file: "bingo-caller-game.html" },
    { title: "おえかきキラキラ", icon: "🌈", file: "draw-sparkle-game.html" },
    { title: "おえかきクレヨン", icon: "🖍️", file: "draw-color-game.html" },
    { title: "かぎあけ", icon: "🔐", file: "key-lock-game.html" },
    { title: "とけいのじかん", icon: "🕐", file: "clock-time-game.html" },
    { title: "おてんきごっこ", icon: "⛅", file: "weather-game.html" },
    { title: "ねずみのおさんぽ", icon: "🐭", file: "mouse-road-game.html" }
  ];

  // 既存のタイトルで問題なく収まっている最長の文字数(7文字)を基準にして、
  // それより長いタイトルだけ文字サイズを比例して縮小し、カード内でキツキツにならないようにする。
  var LABEL_BASE_LEN = 7;

  var grid = document.getElementById("grid");
  GAMES.forEach(function (game) {
    var scale = Math.min(1, LABEL_BASE_LEN / game.title.length);
    var labelSize = "clamp(13px, " + (3.2 * scale).toFixed(2) + "vw, " + Math.round(20 * scale) + "px)";
    var a = document.createElement("a");
    a.className = "card";
    a.href = game.file;
    a.innerHTML =
      '<span class="icon">' + game.icon + '</span>' +
      '<span class="label" style="font-size: ' + labelSize + '">' + game.title + '</span>';
    grid.appendChild(a);
  });

  // 子どもが遊んでいて誤って開いてしまわないよう、利用規約は5回タップしないと開かないようにする。
  // 閉じる操作は誤操作の心配がないので、そのまま1回で許可する。
  var terms = document.getElementById("terms");
  var termsSummary = terms.querySelector("summary");
  var TERMS_TAPS_REQUIRED = 5;
  var termsTapCount = 0;
  termsSummary.addEventListener("click", function (ev) {
    if (terms.open) {
      termsTapCount = 0;
      return;
    }
    ev.preventDefault();
    termsTapCount++;
    if (termsTapCount >= TERMS_TAPS_REQUIRED) {
      termsTapCount = 0;
      terms.open = true;
    }
  });
</script>
</body>
</html>
