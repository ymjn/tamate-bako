<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かぎあけゲーム</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  .target {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    touch-action: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               float 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes popin {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { margin-top: 0px; }
    50%      { margin-top: -14px; }
  }
  .target.unlocking {
    animation: unlockPop 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes unlockPop {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    30%  { transform: scale(1.35) rotate(-10deg); opacity: 1; }
    100% { transform: scale(1.8) rotate(8deg); opacity: 0; }
  }
  .target.shake {
    animation: shakeWiggle 0.4s ease-in-out;
  }
  @keyframes shakeWiggle {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20%  { transform: translateX(-8px) rotate(-6deg); }
    40%  { transform: translateX(8px) rotate(6deg); }
    60%  { transform: translateX(-6px) rotate(-4deg); }
    80%  { transform: translateX(6px) rotate(4deg); }
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--end-scale, 0.4)) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22vw;
    pointer-events: none;
    opacity: 0;
  }
  #celebrate.show {
    animation: celebrate 1.1s ease-out forwards;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    30%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
    60%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 0; }
  }
  #celebrate.grand {
    animation: grandCelebrate 3s ease-out forwards;
  }
  @keyframes grandCelebrate {
    0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
    20%  { transform: scale(1.35) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 22px gold); }
    40%  { transform: scale(1.05) rotate(-5deg); opacity: 1; filter: drop-shadow(0 0 10px gold); }
    60%  { transform: scale(1.3) rotate(4deg); opacity: 1; filter: drop-shadow(0 0 26px gold); }
    80%  { transform: scale(1.1) rotate(-2deg); opacity: 1; filter: drop-shadow(0 0 12px gold); }
    100% { transform: scale(1.5) rotate(0deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
  }
  .key {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    touch-action: none;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
    z-index: 1500;
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               keyIdle 2.4s ease-in-out infinite;
    transition: opacity 0.2s ease;
    will-change: transform;
  }
  .key.dragging {
    animation: none;
    transform: scale(1.15);
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.25)) drop-shadow(0 0 18px gold);
  }
  .key.consumed {
    animation: none;
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    opacity: 0;
    transform: scale(0.4) rotate(20deg);
    pointer-events: none;
  }
  @keyframes keyIdle {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage"></div>
<div id="celebrate">🎉</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var celebrate = document.getElementById("celebrate");

  var KINDS = {
    lock: { keyEmoji: "🔑", targetGlyphs: ["🔒️"], openEmoji: "🔓️", maxTargets: 2 },
    door: { keyEmoji: "🗝️", targetGlyphs: ["🚪"], openEmoji: null, maxTargets: 2 }
  };
  var MILESTONE = 6;
  var KEY_SIZE = 70;
  // 2本指で🔑と🗝️を本当に同時に操作しないと成立しないくらいの、かなり厳しい時間窓
  var DOUBLE_OPEN_WINDOW = 200;
  var unlockCount = 0;
  var targets = [];
  var keySlots = { lock: null, door: null };
  var lastOpenTime = { lock: -Infinity, door: -Infinity };
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* audio unavailable, ignore */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  // --- Sound effect variants: a few different unlock timbres, one is chosen at random each unlock ---
  var SOUND_VARIANTS = [
    function clickChime(t0) {
      var click = audioCtx.createOscillator();
      var clickGain = audioCtx.createGain();
      click.type = "square";
      click.frequency.setValueAtTime(180, t0);
      clickGain.gain.setValueAtTime(0.25, t0);
      clickGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
      click.connect(clickGain).connect(audioCtx.destination);
      click.start(t0);
      click.stop(t0 + 0.07);

      [880, 1320].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + 0.08 + i * 0.07;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.25);
      });
    },
    function risingTwoTone(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(420, t0);
      osc.frequency.exponentialRampToValueAtTime(940, t0 + 0.18);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.32, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.26);
    },
    function sparkleTrill(t0) {
      [660, 990, 1320].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.05;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.28, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.17);
      });
    },
    function boingOpen(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(260, t0);
      osc.frequency.linearRampToValueAtTime(760, t0 + 0.1);
      osc.frequency.linearRampToValueAtTime(520, t0 + 0.24);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    }
  ];

  function playUnlock() {
    if (!audioCtx) return;
    var variant = SOUND_VARIANTS[Math.floor(Math.random() * SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playCelebrationChime() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  // --- イースターエッグ: 🔑と🗝️をほぼ同時に開けたときの豪華なファンファーレ ---
  function playDoubleOpenFanfare() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var melody = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093];
    melody.forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.08;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.32, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
    var chordStart = t0 + melody.length * 0.08 + 0.05;
    [1046.5, 1318.5, 1567.98, 2093].forEach(function (freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, chordStart);
      gain.gain.setValueAtTime(0.0001, chordStart);
      gain.gain.exponentialRampToValueAtTime(0.24, chordStart + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(chordStart);
      osc.stop(chordStart + 0.95);
    });
  }

  // --- Particle effect variants: different glyphs & motion, one is chosen at random each unlock ---
  var PARTICLE_VARIANTS = [
    { glyphs: ["✨", "⭐️", "💫", "🌟"], count: 8, angle: [0, Math.PI * 2], dist: [40, 120], rot: [0, 0], duration: 600, size: [18, 34] },
    { glyphs: ["🔓️", "✨", "💛"], count: 6, angle: [-Math.PI * 0.85, -Math.PI * 0.15], dist: [50, 110], rot: [-40, 40], duration: 750, size: [18, 30] },
    { glyphs: ["🎊", "🟡", "🔵", "🟢"], count: 10, angle: [0, Math.PI * 2], dist: [50, 100], rot: [360, 720], duration: 700, size: [14, 26] }
  ];

  function burstParticles(x, y) {
    var v = PARTICLE_VARIANTS[Math.floor(Math.random() * PARTICLE_VARIANTS.length)];
    for (var i = 0; i < v.count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = v.glyphs[Math.floor(Math.random() * v.glyphs.length)];
      var size = rand(v.size[0], v.size[1]);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(v.angle[0], v.angle[1]);
      var dist = rand(v.dist[0], v.dist[1]);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(v.rot[0], v.rot[1]) + "deg");
      p.style.animationDuration = v.duration + "ms";
      stage.appendChild(p);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life + 50);
      })(p, v.duration);
    }
  }

  function showCelebration(text, mode) {
    celebrate.textContent = text || "🎉";
    celebrate.classList.remove("show", "grand");
    void celebrate.offsetWidth;
    celebrate.classList.add("show");
    if (mode) celebrate.classList.add(mode);
  }

  // --- イースターエッグ: 🔑と🗝️をほぼ同時に開けたときに降らせる紙吹雪 ---
  function doubleOpenConfetti() {
    var glyphs = ["🔑", "🗝️", "✨", "🎉", "🌟"];
    for (var i = 0; i < 30; i++) {
      (function (i) {
        setTimeout(function () {
          var p = document.createElement("div");
          p.className = "particle";
          p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          var size = rand(20, 38);
          p.style.fontSize = size + "px";
          var startX = rand(0, window.innerWidth);
          p.style.left = (startX - size / 2) + "px";
          p.style.top = "-40px";
          var duration = rand(2000, 3200);
          p.style.setProperty("--dx", rand(-60, 60) + "px");
          p.style.setProperty("--dy", (window.innerHeight + 80) + "px");
          p.style.setProperty("--rot", rand(-180, 180) + "deg");
          p.style.setProperty("--end-scale", "0.9");
          p.style.animationDuration = duration + "ms";
          stage.appendChild(p);
          setTimeout(function () { p.remove(); }, duration + 50);
        }, i * 55);
      })(i);
    }
  }

  function removeFrom(list, item) {
    var idx = list.indexOf(item);
    if (idx >= 0) list.splice(idx, 1);
  }

  function distance(ax, ay, bx, by) {
    return Math.hypot(ax - bx, ay - by);
  }

  // 現在画面上にあるアイテム(対象+鍵)の中心座標とサイズを集める。
  // アニメーション中の transform に影響されないよう、実測(getBoundingClientRect)ではなく
  // 配置時に決めた論理座標(style.left/top と保存済みサイズ)を使う。
  function getOccupants() {
    var list = [];
    targets.forEach(function (t) {
      list.push({
        cx: parseFloat(t.el.style.left) + t.size / 2,
        cy: parseFloat(t.el.style.top) + t.size / 2,
        size: t.size
      });
    });
    Object.keys(keySlots).forEach(function (k) {
      var key = keySlots[k];
      if (!key) return;
      list.push({
        cx: parseFloat(key.el.style.left) + KEY_SIZE / 2,
        cy: parseFloat(key.el.style.top) + KEY_SIZE / 2,
        size: KEY_SIZE
      });
    });
    return list;
  }

  // 既存アイテムとできるだけ重ならない配置(中心座標)を探す。見つからなければ一番余裕のある候補を使う。
  function findClearSpot(size, marginTop) {
    var margin = size * 0.6;
    var occupants = getOccupants();
    var bestPos = null;
    var bestGap = -Infinity;

    for (var i = 0; i < 30; i++) {
      var cx = rand(margin + size / 2, window.innerWidth - margin - size / 2);
      var cy = rand(marginTop + size / 2, window.innerHeight - margin - size / 2);
      var minGap = Infinity;
      for (var j = 0; j < occupants.length; j++) {
        var o = occupants[j];
        var gap = distance(cx, cy, o.cx, o.cy) - (size / 2 + o.size / 2);
        if (gap < minGap) minGap = gap;
      }
      if (occupants.length === 0 || minGap > 20) return { cx: cx, cy: cy };
      if (minGap > bestGap) {
        bestGap = minGap;
        bestPos = { cx: cx, cy: cy };
      }
    }
    return bestPos;
  }

  function spawnTarget(kind) {
    var count = targets.filter(function (t) { return t.kind === kind; }).length;
    if (count >= KINDS[kind].maxTargets) return;

    var glyphs = KINDS[kind].targetGlyphs;
    var glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
    var size = rand(130, 150);
    var pos = findClearSpot(size, 70);
    var el = document.createElement("div");
    el.className = "target";
    el.textContent = glyph;
    el.style.fontSize = size + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = (pos.cx - size / 2) + "px";
    el.style.top = (pos.cy - size / 2) + "px";

    stage.appendChild(el);
    targets.push({ el: el, kind: kind, unlocking: false, size: size });
  }

  // kindFilter が省略された場合は種類を問わず重なっている対象を返す(不一致の判定に使う)
  function findOverlapping(keyEl, kindFilter) {
    var kRect = keyEl.getBoundingClientRect();
    var kx = kRect.left + kRect.width / 2;
    var ky = kRect.top + kRect.height / 2;

    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      if (t.unlocking) continue;
      if (kindFilter && t.kind !== kindFilter) continue;
      var r = t.el.getBoundingClientRect();
      var tx = r.left + r.width / 2;
      var ty = r.top + r.height / 2;
      var threshold = (kRect.width / 2 + r.width / 2) * 0.55;
      if (distance(kx, ky, tx, ty) < threshold) return t;
    }
    return null;
  }

  function shakeTarget(target) {
    target.el.classList.remove("shake");
    void target.el.offsetWidth;
    target.el.classList.add("shake");
    setTimeout(function () { target.el.classList.remove("shake"); }, 400);
  }

  function resolvePair(key, kind, target) {
    target.unlocking = true;
    var openEmoji = KINDS[kind].openEmoji;
    if (openEmoji) target.el.textContent = openEmoji;
    target.el.classList.add("unlocking");

    var r = target.el.getBoundingClientRect();
    burstParticles(r.left + r.width / 2, r.top + r.height / 2);
    playUnlock();

    unlockCount++;

    var now = Date.now();
    var otherKind = Object.keys(KINDS).filter(function (k) { return k !== kind; })[0];
    var isDoubleOpen = (now - lastOpenTime[otherKind]) <= DOUBLE_OPEN_WINDOW;
    lastOpenTime[kind] = now;

    if (isDoubleOpen) {
      showCelebration("✨🔑🗝️✨", "grand");
      playDoubleOpenFanfare();
      doubleOpenConfetti();
    } else if (unlockCount % MILESTONE === 0) {
      showCelebration();
      playCelebrationChime();
    }

    key.dragging = false;
    key.el.classList.add("consumed");

    setTimeout(function () {
      target.el.remove();
      removeFrom(targets, target);
      key.el.remove();
      keySlots[kind] = null;
      setTimeout(function () { spawnTarget(kind); }, rand(150, 400));
      setTimeout(function () { spawnKey(kind); }, rand(150, 400));
    }, 500);
  }

  function moveElTo(el, x, y, size) {
    el.style.left = (x - size / 2) + "px";
    el.style.top = (y - size / 2) + "px";
  }

  function spawnKey(kind) {
    if (keySlots[kind]) return;

    var el = document.createElement("div");
    el.className = "key";
    el.textContent = KINDS[kind].keyEmoji;
    el.style.width = KEY_SIZE + "px";
    el.style.height = KEY_SIZE + "px";
    el.style.fontSize = KEY_SIZE + "px";

    var pos = findClearSpot(KEY_SIZE, 70);
    moveElTo(el, pos.cx, pos.cy, KEY_SIZE);

    stage.appendChild(el);
    var key = { el: el, dragging: false };
    keySlots[kind] = key;

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      ensureAudio();
      key.dragging = true;
      el.classList.add("dragging");
      el.setPointerCapture(ev.pointerId);
      moveElTo(el, ev.clientX, ev.clientY, KEY_SIZE);
    }, { passive: false });

    el.addEventListener("pointermove", function (ev) {
      if (!key.dragging) return;
      ev.preventDefault();
      moveElTo(el, ev.clientX, ev.clientY, KEY_SIZE);
    }, { passive: false });

    function endDrag(ev) {
      if (!key.dragging) return;
      key.dragging = false;
      el.classList.remove("dragging");
      try { el.releasePointerCapture(ev.pointerId); } catch (e) { /* already released */ }
      var target = findOverlapping(el, kind);
      if (target) {
        ensureAudio();
        resolvePair(key, kind, target);
      } else {
        var wrongTarget = findOverlapping(el, null);
        if (wrongTarget) shakeTarget(wrongTarget);
      }
    }

    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  var kinds = Object.keys(KINDS);
  kinds.forEach(function (kind, kIdx) {
    for (var i = 0; i < KINDS[kind].maxTargets; i++) {
      (function (k, delay) {
        setTimeout(function () { spawnTarget(k); }, delay);
      })(kind, kIdx * 150 + i * 250);
    }
    (function (k, delay) {
      setTimeout(function () { spawnKey(k); }, delay);
    })(kind, kIdx * 300);
  });

  window.addEventListener("resize", function () {
    targets.forEach(function (target) {
      var rect = target.el.getBoundingClientRect();
      var x = Math.min(parseFloat(target.el.style.left), window.innerWidth - rect.width - 10);
      var y = Math.min(parseFloat(target.el.style.top), window.innerHeight - rect.height - 10);
      target.el.style.left = Math.max(10, x) + "px";
      target.el.style.top = Math.max(10, y) + "px";
    });
    kinds.forEach(function (kind) {
      var key = keySlots[kind];
      if (!key) return;
      var rect = key.el.getBoundingClientRect();
      var x = Math.min(parseFloat(key.el.style.left), window.innerWidth - rect.width - 10);
      var y = Math.min(parseFloat(key.el.style.top), window.innerHeight - rect.height - 10);
      key.el.style.left = Math.max(10, x) + "px";
      key.el.style.top = Math.max(10, y) + "px";
    });
  });
})();
</script>
