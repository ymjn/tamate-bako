<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>よるのぽんぽんゲーム</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #0f0c29, #24243e, #1b1035, #10131f);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  .bubble {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    filter: drop-shadow(0 0 12px rgba(150, 120, 255, 0.45));
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               float 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes popin {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { margin-top: 0px; }
    50%      { margin-top: -14px; }
  }
  .bubble.popping {
    animation: popout 0.28s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popout {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--end-scale, 0.4)) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22vw;
    pointer-events: none;
    opacity: 0;
  }
  #celebrate.show {
    animation: celebrate 1.1s ease-out forwards;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    30%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
    60%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 0; }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage"></div>
<div id="celebrate">🌙</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var celebrate = document.getElementById("celebrate");

  var ITEMS = [
    "👻", "🦇", "🕷️", "🐈‍⬛", "🦉", "🔮",
    "🌙", "⭐️", "🪐", "👽", "🛸", "🌠"
  ];

  var MAX_BUBBLES = 6;
  var popCount = 0;
  var bubbles = new Set();
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* オーディオが使えない環境は無視 */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // --- 効果音のバリエーション: 低めで少し不思議な音色を数種類、毎回ランダムに選ぶ ---
  var SOUND_VARIANTS = [
    function lowPop(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(260, t0);
      osc.frequency.exponentialRampToValueAtTime(140, t0 + 0.16);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.28);
    },
    function hollowBlip(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(160, t0 + 0.18);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);
    },
    function spookyWarble(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(180, t0);
      osc.frequency.linearRampToValueAtTime(320, t0 + 0.09);
      osc.frequency.linearRampToValueAtTime(150, t0 + 0.26);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.36);
    },
    function duoChime(t0) {
      [392, 466.16].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.07;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.22, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      });
    }
  ];

  function playPop() {
    if (!audioCtx) return;
    var variant = SOUND_VARIANTS[Math.floor(Math.random() * SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playCelebrationChime() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [392, 466.16, 587.33, 698.46].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  // --- パーティクルのバリエーション: 夜っぽいグリフと動き、毎回ランダムに選ぶ ---
  var PARTICLE_VARIANTS = [
    { glyphs: ["✨", "💜", "🔮", "⭐️"], count: 8, angle: [0, Math.PI * 2], dist: [40, 120], rot: [0, 0], duration: 600, size: [18, 34] },
    { glyphs: ["🦇", "🌙"], count: 6, angle: [-Math.PI * 0.85, -Math.PI * 0.15], dist: [60, 140], rot: [-40, 40], duration: 800, size: [18, 30] },
    { glyphs: ["🕸️", "🕷️", "⚫"], count: 9, angle: [0, Math.PI * 2], dist: [50, 100], rot: [360, 720], duration: 700, size: [14, 26] },
    { glyphs: ["⭐️", "🌟", "✨"], count: 5, angle: [-Math.PI * 0.75, -Math.PI * 0.25], dist: [50, 90], rot: [-30, 30], duration: 900, size: [20, 32] }
  ];

  function burstParticles(x, y) {
    var v = PARTICLE_VARIANTS[Math.floor(Math.random() * PARTICLE_VARIANTS.length)];
    for (var i = 0; i < v.count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = v.glyphs[Math.floor(Math.random() * v.glyphs.length)];
      var size = rand(v.size[0], v.size[1]);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(v.angle[0], v.angle[1]);
      var dist = rand(v.dist[0], v.dist[1]);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(v.rot[0], v.rot[1]) + "deg");
      p.style.animationDuration = v.duration + "ms";
      stage.appendChild(p);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life + 50);
      })(p, v.duration);
    }
  }

  function spawnBubble() {
    if (bubbles.size >= MAX_BUBBLES) return;

    var emoji = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    var size = rand(70, 130);
    var el = document.createElement("div");
    el.className = "bubble";
    el.textContent = emoji;
    el.style.fontSize = size + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";

    var margin = size * 0.6;
    var x = rand(margin, window.innerWidth - margin - size);
    var y = rand(margin, window.innerHeight - margin - size);
    el.style.left = x + "px";
    el.style.top = y + "px";

    stage.appendChild(el);
    bubbles.add(el);

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      pop(el, ev.clientX, ev.clientY);
    }, { passive: false });
  }

  function pop(el, x, y) {
    if (el.classList.contains("popping")) return;
    ensureAudio();
    el.classList.add("popping");
    bubbles.delete(el);
    burstParticles(x, y);
    playPop();

    popCount++;
    if (popCount % 8 === 0) {
      celebrate.textContent = "🌙";
      celebrate.classList.remove("show");
      void celebrate.offsetWidth;
      celebrate.classList.add("show");
      playCelebrationChime();
    }

    setTimeout(function () {
      el.remove();
      spawnBubble();
    }, 280);
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  document.addEventListener("pointerdown", ensureAudio, { once: true });

  for (var i = 0; i < 4; i++) {
    setTimeout(spawnBubble, i * 300);
  }
  setInterval(function () {
    if (bubbles.size < MAX_BUBBLES) spawnBubble();
  }, 1100);

  window.addEventListener("resize", function () {
    bubbles.forEach(function (el) {
      var rect = el.getBoundingClientRect();
      var x = Math.min(parseFloat(el.style.left), window.innerWidth - rect.width - 10);
      var y = Math.min(parseFloat(el.style.top), window.innerHeight - rect.height - 10);
      el.style.left = Math.max(10, x) + "px";
      el.style.top = Math.max(10, y) + "px";
    });
  });
})();
</script>
</body>
</html>
