<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぽんぽんゲーム</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg, #ffd6e8, #cdeaff, #fff3bf, #d9f7d9);
    background-size: 400% 400%;
    animation: bgshift 24s ease-in-out infinite;
  }
  @keyframes bgshift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  .bubble {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               float 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes popin {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { margin-top: 0px; }
    50%      { margin-top: -14px; }
  }
  .bubble.popping {
    animation: popout 0.28s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popout {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .bubble.matched {
    animation: popin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               float 3.2s ease-in-out infinite,
               matchGlow 0.9s ease-in-out infinite;
  }
  @keyframes matchGlow {
    0%, 100% { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15)) drop-shadow(0 0 2px gold); }
    50%      { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15)) drop-shadow(0 0 26px gold); }
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--end-scale, 0.4)) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #celebrate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22vw;
    pointer-events: none;
    opacity: 0;
  }
  #celebrate.show {
    animation: celebrate 1.1s ease-out forwards;
  }
  @keyframes celebrate {
    0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    30%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
    60%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 0; }
  }
  #celebrate.match {
    animation: matchCelebrate 1.6s ease-out forwards;
  }
  @keyframes matchCelebrate {
    0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    25%  { transform: scale(1.3) rotate(8deg); opacity: 1; }
    50%  { transform: scale(1.05) rotate(-4deg); opacity: 1; }
    75%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
    100% { transform: scale(1.5) rotate(0deg); opacity: 0; }
  }
  #celebrate.grand {
    animation: grandCelebrate 3s ease-out forwards;
  }
  @keyframes grandCelebrate {
    0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
    20%  { transform: scale(1.35) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 22px gold); }
    40%  { transform: scale(1.05) rotate(-5deg); opacity: 1; filter: drop-shadow(0 0 10px gold); }
    60%  { transform: scale(1.3) rotate(4deg); opacity: 1; filter: drop-shadow(0 0 26px gold); }
    80%  { transform: scale(1.1) rotate(-2deg); opacity: 1; filter: drop-shadow(0 0 12px gold); }
    100% { transform: scale(1.5) rotate(0deg); opacity: 0; filter: drop-shadow(0 0 0 gold); }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage"></div>
<div id="celebrate">🎉</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var celebrate = document.getElementById("celebrate");

  var ITEMS = [
    "🐶", "🐱", "🐰", "🐻", "🐼", "🦁", "🐸", "🐷", "🐵", "🐥",
    "🍎", "🍌", "🍓", "🍉", "🍇",
    "🚗", "🚌", "🚀", "✈️", "🚂",
    "⭐️", "🌈", "🎈", "🌸", "💙"
  ];

  var MAX_BUBBLES = 6;
  var MATCH_COUNT = 3;
  var popCount = 0;
  var bubbles = new Set();
  var matchedEmoji = null;
  var grandFired = false;
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* audio unavailable, ignore */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // --- Sound effect variants: a few different pop timbres, one is chosen at random each pop ---
  var SOUND_VARIANTS = [
    function classicPop(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, t0);
      osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.12);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.25);
    },
    function softBlip(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(660, t0);
      osc.frequency.exponentialRampToValueAtTime(340, t0 + 0.15);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.22);
    },
    function boing(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(300, t0);
      osc.frequency.linearRampToValueAtTime(700, t0 + 0.08);
      osc.frequency.linearRampToValueAtTime(450, t0 + 0.22);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    },
    function chimePing(t0) {
      [880, 1320].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.06;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.25, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.2);
      });
    }
  ];

  function playPop() {
    if (!audioCtx) return;
    var variant = SOUND_VARIANTS[Math.floor(Math.random() * SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  function playCelebrationChime() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  // --- イースターエッグ: 同じ絵柄が画面上に3つ揃うと流れる特別なファンファーレ ---
  function playMatchFanfare() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [523, 659, 784, 1047, 1319, 1568].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.08;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.26);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.28);
    });
  }

  // --- イースターエッグ: 6つ全部が同じ絵柄で埋まったときの豪華なファンファーレ ---
  function playGrandFanfare() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var melody = [523, 659, 784, 1047, 1319, 1568, 2093];
    melody.forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.09;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.32, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
    var chordStart = t0 + melody.length * 0.09 + 0.05;
    [1047, 1319, 1568, 2093].forEach(function (freq) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, chordStart);
      gain.gain.setValueAtTime(0.0001, chordStart);
      gain.gain.exponentialRampToValueAtTime(0.22, chordStart + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 0.8);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(chordStart);
      osc.stop(chordStart + 0.85);
    });
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  // --- Particle effect variants: different glyphs & motion, one is chosen at random each pop ---
  var PARTICLE_VARIANTS = [
    { glyphs: ["✨", "⭐️", "💫", "🌟"], count: 8, angle: [0, Math.PI * 2], dist: [40, 120], rot: [0, 0], duration: 600, size: [18, 34] },
    { glyphs: ["💕", "💖", "💗", "💓"], count: 6, angle: [-Math.PI * 0.85, -Math.PI * 0.15], dist: [60, 140], rot: [-40, 40], duration: 800, size: [18, 30] },
    { glyphs: ["🎊", "🟡", "🔵", "🟢", "🔺"], count: 10, angle: [0, Math.PI * 2], dist: [50, 100], rot: [360, 720], duration: 700, size: [14, 26] },
    { glyphs: ["🎵", "🎶"], count: 5, angle: [-Math.PI * 0.75, -Math.PI * 0.25], dist: [50, 90], rot: [-30, 30], duration: 900, size: [20, 32] }
  ];

  function burstParticles(x, y) {
    var v = PARTICLE_VARIANTS[Math.floor(Math.random() * PARTICLE_VARIANTS.length)];
    for (var i = 0; i < v.count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = v.glyphs[Math.floor(Math.random() * v.glyphs.length)];
      var size = rand(v.size[0], v.size[1]);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(v.angle[0], v.angle[1]);
      var dist = rand(v.dist[0], v.dist[1]);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(v.rot[0], v.rot[1]) + "deg");
      p.style.animationDuration = v.duration + "ms";
      stage.appendChild(p);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life + 50);
      })(p, v.duration);
    }
  }

  // --- イースターエッグ: 6つ全部揃ったときに降らせる紙吹雪 ---
  function grandConfettiShower(emoji) {
    var glyphs = [emoji, "✨", "🎉", "🌟"];
    for (var i = 0; i < 30; i++) {
      (function (i) {
        setTimeout(function () {
          var p = document.createElement("div");
          p.className = "particle";
          p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          var size = rand(20, 38);
          p.style.fontSize = size + "px";
          var startX = rand(0, window.innerWidth);
          p.style.left = (startX - size / 2) + "px";
          p.style.top = "-40px";
          var duration = rand(2000, 3200);
          p.style.setProperty("--dx", rand(-60, 60) + "px");
          p.style.setProperty("--dy", (window.innerHeight + 80) + "px");
          p.style.setProperty("--rot", rand(-180, 180) + "deg");
          p.style.setProperty("--end-scale", "0.9");
          p.style.animationDuration = duration + "ms";
          stage.appendChild(p);
          setTimeout(function () { p.remove(); }, duration + 50);
        }, i * 55);
      })(i);
    }
  }

  function spawnBubble() {
    if (bubbles.size >= MAX_BUBBLES) return;

    var emoji = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    var size = rand(70, 130);
    var el = document.createElement("div");
    el.className = "bubble";
    el.textContent = emoji;
    el.style.fontSize = size + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";

    var margin = size * 0.6;
    var x = rand(margin, window.innerWidth - margin - size);
    var y = rand(margin, window.innerHeight - margin - size);
    el.style.left = x + "px";
    el.style.top = y + "px";

    stage.appendChild(el);
    bubbles.add(el);

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      pop(el, ev.clientX, ev.clientY);
    }, { passive: false });

    if (matchedEmoji === emoji) {
      growMatch(el, emoji);
    } else {
      checkForMatch(emoji);
    }
  }

  function showCelebration(text, mode, fontSizeVw) {
    celebrate.textContent = text;
    celebrate.classList.remove("show", "match", "grand");
    celebrate.style.fontSize = fontSizeVw ? fontSizeVw + "vw" : "";
    void celebrate.offsetWidth;
    celebrate.classList.add("show");
    if (mode) celebrate.classList.add(mode);
  }

  // --- イースターエッグ: 同じ絵柄のバブルを消さずに3つ以上揃えると光り出し、
  //     増えるたびに絵文字も増えて演出、6つ全部揃うと一番豪華な演出に ---
  var CELEBRATE_FONT_SIZE = { 3: 15, 4: 12, 5: 10, 6: 8 };

  function countEmoji(emoji) {
    var n = 0;
    bubbles.forEach(function (el) {
      if (el.textContent === emoji && !el.classList.contains("popping")) n++;
    });
    return n;
  }

  function checkForMatch(emoji) {
    if (matchedEmoji) return;
    var count = countEmoji(emoji);
    if (count >= MATCH_COUNT) {
      matchedEmoji = emoji;
      grandFired = false;
      bubbles.forEach(function (el) {
        if (el.textContent === emoji && !el.classList.contains("popping")) {
          el.classList.add("matched");
          var rect = el.getBoundingClientRect();
          burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
      });
      celebrateForCount(emoji, count);
    }
  }

  // 揃った絵柄と同じものが増えるたびに、絵文字を増やしてもう一度演出する
  function growMatch(el, emoji) {
    el.classList.add("matched");
    var rect = el.getBoundingClientRect();
    burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    celebrateForCount(emoji, countEmoji(emoji));
  }

  function celebrateForCount(emoji, count) {
    ensureAudio();
    if (count >= MAX_BUBBLES) {
      grandFired = true;
      showCelebration(repeatEmoji(emoji, MAX_BUBBLES), "grand", CELEBRATE_FONT_SIZE[MAX_BUBBLES]);
      playGrandFanfare();
      grandConfettiShower(emoji);
    } else {
      showCelebration(repeatEmoji(emoji, count), "match", CELEBRATE_FONT_SIZE[count]);
      playMatchFanfare();
    }
  }

  function repeatEmoji(emoji, count) {
    var text = "";
    for (var i = 0; i < count; i++) text += emoji;
    return text;
  }

  function clearMatch() {
    if (!matchedEmoji) return;
    matchedEmoji = null;
    grandFired = false;
    bubbles.forEach(function (el) {
      el.classList.remove("matched");
    });
  }

  function pop(el, x, y) {
    if (el.classList.contains("popping")) return;
    ensureAudio();
    var wasMatched = el.classList.contains("matched");
    el.classList.add("popping");
    bubbles.delete(el);
    burstParticles(x, y);
    playPop();

    if (wasMatched) clearMatch();

    popCount++;
    if (popCount % 8 === 0) {
      showCelebration("🎉", null);
      playCelebrationChime();
    }

    setTimeout(function () {
      el.remove();
      spawnBubble();
    }, 280);
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  document.addEventListener("pointerdown", ensureAudio, { once: true });

  for (var i = 0; i < 4; i++) {
    setTimeout(spawnBubble, i * 300);
  }
  setInterval(function () {
    if (bubbles.size < MAX_BUBBLES) spawnBubble();
  }, 1100);

  window.addEventListener("resize", function () {
    bubbles.forEach(function (el) {
      var rect = el.getBoundingClientRect();
      var x = Math.min(parseFloat(el.style.left), window.innerWidth - rect.width - 10);
      var y = Math.min(parseFloat(el.style.top), window.innerHeight - rect.height - 10);
      el.style.left = Math.max(10, x) + "px";
      el.style.top = Math.max(10, y) + "px";
    });
  });
})();
</script>
</body>
</html>
