<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>スタンプゲーム</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.9), rgba(255,255,255,0) 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.6), rgba(255,255,255,0) 40%),
      #fdf3dc;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  .stamp {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    animation: stampin 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes stampin {
    0%   { transform: scale(0) rotate(var(--r, 0deg)); opacity: 0; }
    70%  { transform: scale(1.2) rotate(var(--r, 0deg)); opacity: 1; }
    100% { transform: scale(1) rotate(var(--r, 0deg)); opacity: 1; }
  }
  .stamp.scurry {
    animation: scurryOff 0.6s ease-in forwards;
  }
  @keyframes scurryOff {
    0%   { transform: translateX(0) translateY(0) rotate(var(--r, 0deg)); }
    20%  { transform: translateX(calc(var(--run-dx) * 0.15)) translateY(-8px) rotate(var(--r, 0deg)); }
    40%  { transform: translateX(calc(var(--run-dx) * 0.4)) translateY(3px) rotate(var(--r, 0deg)); }
    60%  { transform: translateX(calc(var(--run-dx) * 0.65)) translateY(-8px) rotate(var(--r, 0deg)); }
    80%  { transform: translateX(calc(var(--run-dx) * 0.85)) translateY(3px) rotate(var(--r, 0deg)); }
    100% { transform: translateX(var(--run-dx)) translateY(0) rotate(var(--r, 0deg)); }
  }
  .particle {
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #back-btn, #clear-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn { left: max(12px, env(safe-area-inset-left)); }
  #clear-btn { right: max(12px, env(safe-area-inset-right)); }
  #back-btn:active, #clear-btn:active { transform: scale(0.9); }

  #picker {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.2);
    z-index: 1800;
    display: flex;
    flex-direction: column;
    padding-top: 10px;
    box-sizing: border-box;
  }
  .picker-handle {
    width: 48px;
    height: 6px;
    border-radius: 3px;
    background: #ddd;
    margin: 0 auto 8px;
    flex: none;
  }
  #picker-grid {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(2, 72px);
    grid-auto-columns: 72px;
    gap: 8px;
    padding: 6px 14px 20px;
    box-sizing: border-box;
  }
  .emoji-btn {
    font-size: 30px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: transparent;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .emoji-btn:active {
    transform: scale(0.88);
  }
  .emoji-btn.selected {
    background: #ffe9bd;
  }
</style>
</head>
<body>
<div id="stage"></div>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<button id="clear-btn" aria-label="ぜんぶけす">🗑️</button>
<div id="picker">
  <div class="picker-handle"></div>
  <div id="picker-grid"></div>
</div>

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* オーディオが使えない環境は無視 */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  var STAMP_VARIANTS = [
    function thump(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(160, t0);
      osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.12);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.2);
    },
    function dab(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, t0);
      osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.09);

    if (!audioCtx) return;
    var variant = STAMP_VARIANTS[Math.floor(Math.random() * STAMP_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.14);
  }

  // --- イースターエッグ: 🐀 だけ、逃げていくときの鳴き声+小走りの音 ---
  function playScurrySound() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [1600, 2000].forEach(function (freq, i) {
      var start = t0 + i * 0.07;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.7, start + 0.09);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.11);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.13);
    });
    for (var i = 0; i < 6; i++) {
      var start = t0 + 0.15 + i * 0.06;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(140 + Math.random() * 40, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.08, start + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.04);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.05);
    }
  }

    if (!audioCtx) return;

    osc.frequency.setValueAtTime(500, t0);
    osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.3);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.36);
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function sparkle(x, y) {

      var p = document.createElement("div");

      p.textContent = "✨";
      var size = rand(14, 22);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(0, Math.PI * 2);
      var dist = rand(20, 50);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.animationDuration = "450ms";
      document.body.appendChild(p);
      (function (node) {
        setTimeout(function () { node.remove(); }, 480);
      })(p);
    }
  }

  // --- イースターエッグ: 🐀 が逃げていくときの砂ぼこり ---
  function dustPuff(x, y) {
    var count = 5;
    for (var i = 0; i < count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = "💨";
      var size = rand(16, 26);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(Math.PI * 0.6, Math.PI * 1.4);
      var dist = rand(20, 50);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.animationDuration = "450ms";
      document.body.appendChild(p);
      (function (node) {
        setTimeout(function () { node.remove(); }, 480);
      })(p);
    }
  }

  function placeStamp(x, y) {
    var size = rand(64, 92);
    var el = document.createElement("div");
    el.className = "stamp";
    el.textContent = currentStamp;
    el.style.fontSize = size + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = (x - size / 2) + "px";
    el.style.top = (y - size / 2) + "px";
    el.style.setProperty("--r", rand(-18, 18) + "deg");
    stage.appendChild(el);
    sparkle(x, y);
    playStampSound();

    if (currentStamp === "🐀") {
      el.style.setProperty("--run-dx", -(x + size + 60) + "px");
      setTimeout(function () {
        el.classList.add("scurry");
        dustPuff(x, y);
        playScurrySound();
      }, 320);
      setTimeout(function () {
        el.remove();
      }, 320 + 650);
    }
  }

  function buildPicker() {
    EMOJIS.forEach(function (emoji) {
      var btn = document.createElement("button");
      btn.className = "emoji-btn";
      btn.textContent = emoji;
      if (emoji === currentStamp) btn.classList.add("selected");
      btn.addEventListener("click", function () {
        ensureAudio();
        currentStamp = emoji;
        pickerGrid.querySelectorAll(".emoji-btn.selected").forEach(function (b) {
          b.classList.remove("selected");
        });
        btn.classList.add("selected");
        playSelectSound();
      });
      pickerGrid.appendChild(btn);
    });
  }

  clearBtn.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    ensureAudio();
    stage.innerHTML = "";
    playClearSound();
  }, { passive: false });

  stage.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    ensureAudio();
    placeStamp(ev.clientX, ev.clientY);
  }, { passive: false });

  document.addEventListener("touchmove", function (e) {
    if (e.target.closest && e.target.closest("#picker-grid")) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  buildPicker();
})();
</script>
</body>
</html>
