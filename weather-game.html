<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>おてんきごっこ</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(180deg, #6ec3f4, #fff6c9);
    transition: background 0.6s ease;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  #weather-display {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none;
    padding-bottom: 110px;
  }
  #sun-rays {
    position: absolute;
    width: min(70vw, 420px);
    height: min(70vw, 420px);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: repeating-conic-gradient(from 0deg, rgba(255,214,89,0.55) 0deg 8deg, transparent 8deg 20deg);
    animation: spinRays 18s linear infinite;
  }
  body[data-weather="sun"] #sun-rays {
    opacity: 1;
  }
  @keyframes spinRays {
    to { transform: rotate(360deg); }
  }
  #weather-emoji {
    position: relative;
    font-size: clamp(140px, 38vw, 260px);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
    line-height: 1;
  }
  .pulse {
    animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .raindrop, .snowflake, .w-cloud {
    position: absolute;
    visibility: hidden;
  }
  .raindrop {
    top: -10vh;
    animation: fallRain linear infinite;
  }
  body[data-weather="rain"] .raindrop,
  body[data-weather="storm"] .raindrop {
    visibility: visible;
  }
  @keyframes fallRain {
    0%   { transform: translateY(-10vh); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateY(115vh); opacity: 0.8; }
  }
  .snowflake {
    top: -10vh;
    animation: fallSnow linear infinite;
  }
  body[data-weather="snow"] .snowflake {
    visibility: visible;
  }
  @keyframes fallSnow {
    0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(6vw, 50vh) rotate(120deg); }
    100% { transform: translate(-4vw, 115vh) rotate(240deg); opacity: 0.9; }
  }
  .w-cloud {
    animation: driftCloud linear infinite;
  }
  body[data-weather="cloud"] .w-cloud {
    visibility: visible;
  }
  @keyframes driftCloud {
    0%   { transform: translateX(-20vw); }
    100% { transform: translateX(120vw); }
  }
  #lightning-flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 500;
    display: none;
  }
  body[data-weather="storm"] #lightning-flash {
    display: block;
    animation: flashLoop 7s linear infinite;
  }
  @keyframes flashLoop {
    0%, 100% { opacity: 0; }
    38%      { opacity: 0; }
    39%      { opacity: 0.85; }
    41%      { opacity: 0; }
    43%      { opacity: 0.5; }
    45%      { opacity: 0; }
  }
  #weather-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 0 10px;
    z-index: 10;
  }
  .weather-btn {
    width: clamp(46px, 12vw, 62px);
    height: clamp(46px, 12vw, 62px);
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 6vw, 34px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  .weather-btn:active {
    transform: scale(0.88);
  }
  .weather-btn.selected {
    transform: scale(1.35);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.9);
    z-index: 1;
  }
  .weather-btn.selected:active {
    transform: scale(1.2);
  }
  .particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation-name: burst;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  #back-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 2000;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  #back-btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
<a id="back-btn" href="index.html" aria-label="もくじにもどる">⬅️</a>
<div id="stage"></div>
<div id="lightning-flash"></div>
<div id="weather-display">
  <div id="sun-rays"></div>
  <div id="weather-emoji">☀️</div>
</div>
<div id="weather-bar"></div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var weatherEmoji = document.getElementById("weather-emoji");
  var weatherBar = document.getElementById("weather-bar");
  var weatherButtons = [];

  var WEATHERS = [
    { key: "sun",     emoji: "☀️",  top: "#6ec3f4", bottom: "#fff6c9" },
    { key: "cloud",   emoji: "☁️",  top: "#aebccc", bottom: "#e7edf3" },
    { key: "rain",    emoji: "🌧️", top: "#5c6f80", bottom: "#93a7b5" },
    { key: "storm",   emoji: "⛈️",  top: "#2b2f3a", bottom: "#4a5568" },
    { key: "snow",    emoji: "❄️",  top: "#c9dcef", bottom: "#f3f8fd" }
  ];

  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* audio unavailable, ignore */ }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function pulse(el) {
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  // --- 効果音: ボタンをタップするたびランダムに選ぶ ---
  var SOUND_VARIANTS = [
    function chimePing(t0) {
      [880, 1320].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.06;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.25, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.2);
      });
    },
    function softBlip(t0) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(660, t0);
      osc.frequency.exponentialRampToValueAtTime(340, t0 + 0.15);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.22);
    },
    function xyloSweep(t0) {
      [440, 554, 659, 784].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.05;
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.25, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.16);
      });
    }
  ];

  function playTapSound() {
    if (!audioCtx) return;
    var variant = SOUND_VARIANTS[Math.floor(Math.random() * SOUND_VARIANTS.length)];
    variant(audioCtx.currentTime);
  }

  // --- 雷が鳴ったときだけの、低い「ゴロゴロ」音(ループはしない) ---
  function playThunder() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [90, 60].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t0 + i * 0.08;
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.95);
    });
  }

  var PARTICLE_GLYPHS = ["✨", "⭐️", "💫"];

  function burstParticles(x, y) {
    var count = Math.floor(rand(6, 9));
    for (var i = 0; i < count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = PARTICLE_GLYPHS[Math.floor(Math.random() * PARTICLE_GLYPHS.length)];
      var size = rand(16, 30);
      p.style.fontSize = size + "px";
      p.style.left = (x - size / 2) + "px";
      p.style.top = (y - size / 2) + "px";
      var angle = rand(0, Math.PI * 2);
      var dist = rand(40, 110);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--rot", rand(-60, 60) + "deg");
      p.style.animationDuration = "650ms";
      stage.appendChild(p);
      (function (node) {
        setTimeout(function () { node.remove(); }, 700);
      })(p);
    }
  }

  // --- 常設の天気パーティクル: 全部あらかじめ用意しておき、
  //     body の data-weather 属性に応じて CSS で見えたり消えたりするだけ(JSでの生成/削除ループなし) ---
  function spawnWeatherParticles() {
    var i, el;
    for (i = 0; i < 30; i++) {
      el = document.createElement("div");
      el.className = "raindrop";
      el.textContent = "💧";
      el.style.left = rand(0, 98) + "vw";
      el.style.fontSize = rand(14, 22) + "px";
      var rainDuration = rand(0.8, 1.5);
      el.style.animationDuration = rainDuration + "s";
      el.style.animationDelay = "-" + rand(0, rainDuration) + "s";
      stage.appendChild(el);
    }
    for (i = 0; i < 24; i++) {
      el = document.createElement("div");
      el.className = "snowflake";
      el.textContent = "❄️";
      el.style.left = rand(0, 96) + "vw";
      el.style.fontSize = rand(16, 26) + "px";
      var snowDuration = rand(4, 8);
      el.style.animationDuration = snowDuration + "s";
      el.style.animationDelay = "-" + rand(0, snowDuration) + "s";
      stage.appendChild(el);
    }
    for (i = 0; i < 4; i++) {
      el = document.createElement("div");
      el.className = "w-cloud";
      el.textContent = "☁️";
      el.style.top = rand(6, 40) + "vh";
      el.style.fontSize = rand(36, 60) + "px";
      var cloudDuration = rand(24, 40);
      el.style.animationDuration = cloudDuration + "s";
      el.style.animationDelay = "-" + rand(0, cloudDuration) + "s";
      stage.appendChild(el);
    }
  }

  function selectWeather(w) {
    ensureAudio();
    playTapSound();
    document.body.dataset.weather = w.key;
    document.body.style.background = "linear-gradient(180deg, " + w.top + " 0%, " + w.bottom + " 100%)";
    if (weatherEmoji.textContent !== w.emoji) {
      weatherEmoji.textContent = w.emoji;
      pulse(weatherEmoji);
    }
    weatherButtons.forEach(function (btn) {
      btn.classList.toggle("selected", btn.weatherKey === w.key);
    });
    if (w.key === "storm") {
      playThunder();
    }
  }

  function buildWeatherButtons() {
    WEATHERS.forEach(function (w) {
      var btn = document.createElement("button");
      btn.className = "weather-btn";
      btn.type = "button";
      btn.textContent = w.emoji;
      btn.weatherKey = w.key;
      btn.setAttribute("aria-label", "おてんきをかえる");
      btn.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        var rect = btn.getBoundingClientRect();
        burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        selectWeather(w);
      }, { passive: false });
      weatherButtons.push(btn);
      weatherBar.appendChild(btn);
    });
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("pointerdown", ensureAudio, { once: true });

  spawnWeatherParticles();
  buildWeatherButtons();
  selectWeather(WEATHERS[0]);
})();
</script>
</body>
</html>
